<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>STM32 Git 工程管家</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="collaboration.css"><script src="app.js" defer></script><script src="collaboration.js" defer></script><script src="expert.js" defer></script><script src="engineering.js" defer></script><link rel="stylesheet" href="engineering.css"><link rel="stylesheet" href="expert.css"></head>
<body><div class="app-shell"><aside class="sidebar">
<div class="brand"><div class="brand-symbol" aria-hidden="true">S<span>·</span></div><div><strong>工程管家</strong><small>STM32 · GIT</small></div></div>
<button id="project-switch" class="project-switch" type="button"><span class="project-switch-icon" aria-hidden="true">▱</span><span class="project-switch-copy"><small>当前工程</small><strong id="sidebar-project">选择工程</strong></span><span aria-hidden="true">⌄</span></button>
<div class="nav-label">工作空间</div><nav class="navigation" aria-label="主要导航">
<button class="nav-item active" data-view="changes" type="button"><span class="nav-icon">◫</span><span>当前修改</span><span id="changes-count" class="nav-counter">0</span></button>
<button class="nav-item" data-view="history" type="button"><span class="nav-icon">◷</span><span>版本历史</span></button>
<button class="nav-item" data-view="collaboration" type="button"><span class="nav-icon">⑂</span><span>分支与草稿</span></button>
<button class="nav-item" data-view="remote" type="button"><span class="nav-icon">⇄</span><span>远程同步</span></button>
<button class="nav-item" data-view="recovery" type="button"><span class="nav-icon">↶</span><span>恢复中心</span></button>
<button class="nav-item" data-view="engineering" type="button"><span class="nav-icon">▣</span><span>构建与工程记录</span></button>
<button class="nav-item" data-view="expert" type="button"><span class="nav-icon">◇</span><span>专家工具箱</span></button>
<button class="nav-item" data-view="logs" type="button"><span class="nav-icon">≡</span><span>操作记录</span></button>
<button class="nav-item" data-view="settings" type="button"><span class="nav-icon">⚙</span><span>工程设置</span></button></nav>
<div class="sidebar-spacer"></div><div class="sidebar-tip"><span class="tip-mark">i</span><div><strong>每一个小进步，都值得记录</strong><p>在 Keil 中保存文件，回到这里检查修改，再保存一个版本。</p></div></div><div class="sidebar-footer"><span class="online-dot"></span><span>本地运行</span><span class="stage-badge">D1 试用</span></div></aside>
<div class="main-shell"><header class="topbar"><div class="project-heading"><span class="eyebrow">我的 STM32 工程</span><h1 id="project-title">开始记录你的工程</h1><button id="project-path" class="path-copy" type="button" title="复制工程路径">选择一个本地工程文件夹</button></div><div class="topbar-actions"><span class="branch-pill"><span aria-hidden="true">⑂</span><span id="branch-name">未选择工程</span></span><button id="open-keil" class="button secondary" type="button">在 Keil 打开 ↗</button><button id="refresh" class="button icon-button" type="button" title="刷新工程状态" aria-label="刷新工程状态">↻</button></div></header>
<div id="progress" class="progress-bar" hidden><span class="spinner"></span><span id="progress-label">正在读取工程…</span></div><div id="error-banner" class="error-banner" role="alert" hidden><div><strong>操作未完成</strong><p id="error-message"></p></div><button id="dismiss-error" class="button icon-button" type="button" aria-label="关闭错误提示">×</button></div><main id="content" tabindex="-1"></main><footer class="statusbar"><span id="status-left">准备就绪</span><span id="status-right">保存版本后可随时查看历史</span></footer></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div><dialog id="modal" class="modal" aria-labelledby="modal-title"><div class="modal-header"><div><span id="modal-kicker" class="eyebrow">工程管家</span><h2 id="modal-title"></h2></div><button id="modal-close" class="button icon-button" type="button" aria-label="关闭对话框">×</button></div><div id="modal-body" class="modal-body"></div><div id="modal-actions" class="modal-actions"></div></dialog></body></html>
